<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>상담 예약장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Song+Myung&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --paper:#FAF7F1;
    --ink:#22262B;
    --rule:#D9D2C0;
    --accent:#B4552F;
    --accent-soft:#F0E3D3;
    --complete:#5B7A5E;
    --muted:#8A8577;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Pretendard', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:48px 20px;
  }
  .sheet{
    width:100%;
    max-width:460px;
  }
  h1{
    font-family:'Song Myung', serif;
    font-weight:400;
    font-size:34px;
    margin:0 0 6px;
    letter-spacing:1px;
  }
  .subtitle{
    font-size:14px;
    color:var(--muted);
    margin:0 0 20px;
  }
  hr{
    border:none;
    border-top:1px solid var(--rule);
    margin:0 0 28px;
  }
  label{
    display:block;
    font-size:13px;
    color:var(--muted);
    margin-bottom:6px;
  }
  input[type="text"], input[type="tel"]{
    width:100%;
    font-family:inherit;
    font-size:16px;
    padding:10px 2px;
    border:none;
    border-bottom:1px solid var(--rule);
    background:transparent;
    color:var(--ink);
    margin-bottom:20px;
    outline:none;
  }
  input[type="text"]:focus, input[type="tel"]:focus{
    border-bottom:1px solid var(--accent);
  }
  button{
    font-family:inherit;
    font-size:15px;
    cursor:pointer;
    border:none;
  }
  .btn-primary{
    width:100%;
    background:var(--accent);
    color:#fff;
    padding:13px 0;
    letter-spacing:1px;
  }
  .btn-primary:disabled{
    background:#C9A897;
    cursor:default;
  }
  .btn-line{
    background:transparent;
    color:var(--accent);
    padding:6px 10px;
    border:1px solid var(--accent);
  }
  .btn-line.muted{
    color:var(--muted);
    border-color:var(--rule);
  }
  .section-title{
    font-size:14px;
    color:var(--muted);
    margin:32px 0 10px;
  }
  .row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 0;
    border-bottom:1px solid var(--rule);
    gap:12px;
  }
  .row .when{
    font-size:15px;
  }
  .row .when .weekday{
    color:var(--muted);
    font-size:13px;
    margin-left:4px;
  }
  .status-closed{
    font-size:13px;
    color:var(--muted);
  }
  .status-mine{
    font-size:13px;
    color:var(--complete);
  }
  .empty{
    font-size:14px;
    color:var(--muted);
    padding:16px 0;
  }
  .feedback-box{
    font-size:14px;
    line-height:1.7;
    padding:14px 0;
    white-space:pre-wrap;
  }
  .error-msg{
    font-size:13px;
    color:var(--accent);
    margin:-10px 0 16px;
    display:none;
  }
  .greeting{
    font-size:16px;
    margin-bottom:4px;
  }
  .greeting .name{
    font-weight:600;
  }
  .switch-user{
    font-size:12px;
    color:var(--muted);
    text-decoration:underline;
    cursor:pointer;
    background:none;
    border:none;
    padding:0;
    margin-bottom:20px;
  }
  #loading{
    font-size:13px;
    color:var(--muted);
  }
</style>
</head>
<body>

<div class="sheet">
  <h1>상담 예약장</h1>
  <p class="subtitle">1:1 진로&middot;취업 상담 예약</p>
  <hr>

  <!-- 1단계: 본인확인 -->
  <div id="verify-step">
    <label for="name-input">이름</label>
    <input type="text" id="name-input" placeholder="예: 김서연">

    <label for="phone-input">전화번호</label>
    <input type="tel" id="phone-input" placeholder="예: 010-1234-5678">

    <p class="error-msg" id="verify-error">등록된 명단에서 확인되지 않았습니다. 담당자에게 문의해주세요.</p>

    <button class="btn-primary" id="verify-btn">확인하기</button>
  </div>

  <!-- 2단계: 예약/피드백 -->
  <div id="main-step" style="display:none;">
    <p class="greeting">안녕하세요, <span class="name" id="greeting-name"></span> 님</p>
    <button class="switch-user" id="switch-user-btn">다른 사람으로 확인하기</button>

    <div id="my-reservation-block" style="display:none;">
      <p class="section-title">내 예약</p>
      <div class="row" id="my-reservation-row"></div>
    </div>

    <p class="section-title">예약 가능한 시간</p>
    <div id="slots-list"></div>

    <p class="section-title">상담 피드백</p>
    <div id="feedback-box" class="feedback-box">불러오는 중...</div>
  </div>

  <p id="loading" style="display:none;">처리 중...</p>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const verifyStep = document.getElementById('verify-step');
const mainStep = document.getElementById('main-step');
const verifyError = document.getElementById('verify-error');
const loading = document.getElementById('loading');

let currentUser = null; // { name, phone }

function normalizePhone(v){
  return (v || '').replace(/[^0-9]/g, '');
}

function formatLabel(dateStr, timeStr){
  const d = new Date(dateStr + 'T' + timeStr + ':00');
  const weekday = ['일','월','화','수','목','금','토'][d.getDay()];
  const [y, m, day] = dateStr.split('-');
  return {
    main: `${parseInt(m)}월 ${parseInt(day)}일 ${timeStr}`,
    weekday: `(${weekday})`
  };
}

function setLoading(on){
  loading.style.display = on ? 'block' : 'none';
}

// 세션 유지: 새로고침해도 다시 입력하지 않도록
function saveSession(user){
  sessionStorage.setItem('booking_user', JSON.stringify(user));
}
function loadSession(){
  const raw = sessionStorage.getItem('booking_user');
  return raw ? JSON.parse(raw) : null;
}
function clearSession(){
  sessionStorage.removeItem('booking_user');
}

async function verifyUser(name, phoneRaw){
  const phone = normalizePhone(phoneRaw);
  if(!name || !phone) return null;
  const snap = await db.collection('participants').doc(phone).get();
  if(!snap.exists) return null;
  const data = snap.data();
  if((data.name || '').trim() !== name.trim()) return null;
  return { name: data.name, phone };
}

document.getElementById('verify-btn').addEventListener('click', async () => {
  verifyError.style.display = 'none';
  const name = document.getElementById('name-input').value.trim();
  const phone = document.getElementById('phone-input').value.trim();
  setLoading(true);
  try{
    const user = await verifyUser(name, phone);
    setLoading(false);
    if(!user){
      verifyError.style.display = 'block';
      return;
    }
    currentUser = user;
    saveSession(user);
    enterMainStep();
  }catch(e){
    setLoading(false);
    alert('확인 중 오류가 발생했습니다: ' + e.message);
  }
});

document.getElementById('switch-user-btn').addEventListener('click', () => {
  clearSession();
  currentUser = null;
  mainStep.style.display = 'none';
  verifyStep.style.display = 'block';
  document.getElementById('name-input').value = '';
  document.getElementById('phone-input').value = '';
});

function enterMainStep(){
  verifyStep.style.display = 'none';
  mainStep.style.display = 'block';
  document.getElementById('greeting-name').textContent = currentUser.name;
  loadSlots();
  loadFeedback();
}

async function loadSlots(){
  const listEl = document.getElementById('slots-list');
  const myBlock = document.getElementById('my-reservation-block');
  const myRow = document.getElementById('my-reservation-row');
  listEl.innerHTML = '<p class="empty">불러오는 중...</p>';

  const snap = await db.collection('slots').orderBy('date').orderBy('time').get();

  let mySlot = null;
  const openSlots = [];
  snap.forEach(doc => {
    const d = doc.data();
    if(d.reservedBy && d.reservedBy.phone === currentUser.phone){
      mySlot = { id: doc.id, ...d };
    }
    if(!d.reservedBy){
      openSlots.push({ id: doc.id, ...d });
    }
  });

  // 내 예약 표시
  if(mySlot){
    myBlock.style.display = 'block';
    const lbl = formatLabel(mySlot.date, mySlot.time);
    myRow.innerHTML = `
      <span class="when">${lbl.main}<span class="weekday">${lbl.weekday}</span></span>
      <button class="btn-line muted" onclick="cancelSlot('${mySlot.id}')">취소</button>
    `;
  } else {
    myBlock.style.display = 'none';
  }

  // 예약 가능 목록
  if(openSlots.length === 0){
    listEl.innerHTML = '<p class="empty">현재 예약 가능한 시간이 없습니다.</p>';
  } else {
    listEl.innerHTML = '';
    openSlots.forEach(s => {
      const lbl = formatLabel(s.date, s.time);
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `
        <span class="when">${lbl.main}<span class="weekday">${lbl.weekday}</span></span>
        <button class="btn-line" ${mySlot ? 'disabled style="opacity:.4;cursor:default;"' : ''} onclick="bookSlot('${s.id}')">예약</button>
      `;
      listEl.appendChild(row);
    });
  }
}

window.bookSlot = async function(slotId){
  setLoading(true);
  try{
    await db.runTransaction(async (tx) => {
      const ref = db.collection('slots').doc(slotId);
      const doc = await tx.get(ref);
      if(!doc.exists) throw new Error('존재하지 않는 시간대입니다.');
      const data = doc.data();
      if(data.reservedBy) throw new Error('이미 마감된 시간입니다.');

      // 중복 예약 방지: 이미 다른 시간에 예약이 있는지 확인
      const allSlots = await db.collection('slots').get();
      let already = false;
      allSlots.forEach(d => {
        const dd = d.data();
        if(dd.reservedBy && dd.reservedBy.phone === currentUser.phone) already = true;
      });
      if(already) throw new Error('이미 예약된 시간이 있습니다. 먼저 취소해주세요.');

      tx.update(ref, {
        reservedBy: { name: currentUser.name, phone: currentUser.phone },
        reservedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    });
    setLoading(false);
    loadSlots();
  }catch(e){
    setLoading(false);
    alert(e.message);
  }
};

window.cancelSlot = async function(slotId){
  if(!confirm('예약을 취소할까요?')) return;
  setLoading(true);
  try{
    await db.collection('slots').doc(slotId).update({
      reservedBy: firebase.firestore.FieldValue.delete(),
      reservedAt: firebase.firestore.FieldValue.delete()
    });
    setLoading(false);
    loadSlots();
  }catch(e){
    setLoading(false);
    alert('취소 중 오류가 발생했습니다: ' + e.message);
  }
};

async function loadFeedback(){
  const box = document.getElementById('feedback-box');
  try{
    const snap = await db.collection('feedback').doc(currentUser.phone).get();
    if(snap.exists && snap.data().content){
      box.textContent = snap.data().content;
    } else {
      box.textContent = '아직 등록된 피드백이 없습니다.';
    }
  }catch(e){
    box.textContent = '피드백을 불러오지 못했습니다.';
  }
}

// 페이지 로드시 세션 확인
(function init(){
  const saved = loadSession();
  if(saved){
    currentUser = saved;
    enterMainStep();
  }
})();
</script>

</body>
</html>
